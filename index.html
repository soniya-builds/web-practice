
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="topbar">
        <a href="#portfolio" class="brand">MY PORTFOLIO</a>

        <nav class="top-navigation">
            <a href="#portfolio">Home</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Layout -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="profile">
                <img
                    src="Assets/image.png"
                    alt="Profile Photo">
            </div>

            <nav class="side-navigation">
                <a href="#portfolio"><span>▣</span> Portfolio</a>
                <a href="#about"><span>●</span> About Me</a>
                <a href="#services"><span>◆</span> Services</a>
                <a href="#resume"><span>▤</span> Resume</a>
                <a href="#skills"><span>✦</span> Skills</a>
                <a href="#blog"><span>▧</span> Blog</a>
                <a href="#contact"><span>✉</span> Contact</a>
            </nav>

            <div class="sidebar-bottom">
                <p>EXTRA</p>
                <a href="#portfolio">My Projects</a>
                <a href="#contact">Hire Me</a>
            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Portfolio Section -->
            <section class="card portfolio" id="portfolio">

                <h2>Portfolio</h2>

                <div class="filters">
                    <button type="button">All</button>
                    <button type="button">Design</button>
                    <button type="button">Development</button>
                    <button type="button">Photography</button>
                </div>

                <div class="projects">

                    <div class="project">
                        <img
                            src="Assets/bodyImage1.png"
                            alt="Laptop and web development">
                    </div>

                    <div class="project">
                        <img
                            src="Assets/bodyimage2.png"
                            alt="Digital design project">
                    </div>

                </div>

            </section>


            <!-- Contact Section -->
            <section class="card contact" id="contact">

                <h2>Contact</h2>

                <div class="contact-content">

                    <!-- Contact Information -->
                    <div class="contact-info">

                        <p><span>●</span> New York, United States</p>
                        <p><span>✉</span> contact@example.com</p>
                        <p><span>☎</span> +1 234 567 890</p>
                        <p><span>🌐</span> www.example.com</p>
                        <p><span>✓</span> Available for new projects</p>

                        <div class="socials">
                            <a href="https://facebook.com/">f</a>
                            <a href="https://twitter.com/">X</a>
                            <a href="https://linkedin.com/">in</a>
                            <a href="https://instagram.com/">◎</a>
                            <a href="https://github.com/">GH</a>
                        </div>

                    </div>


                    <!-- Contact Form -->
                    <form class="contact-form" action="#" method="get">

                        <!-- Name and Email -->
                        <div class="form-row">

                            <div class="form-group">
                                <label for="name">Your Name</label>
                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="Your name"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="email">Your Email</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="Your email"
                                    required>
                            </div>

                        </div>

                        <!-- Subject and Nationality -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input
                                    type="text"
                                    id="subject"
                                    name="subject"
                                    placeholder="Subject"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="nationality">Nationality</label>
                                <input
                                    type="text"
                                    id="nationality"
                                    name="nationality"
                                    placeholder="Nationality">
                            </div>
                        </div>

                        <!-- Large Message Box -->
                        <div class="form-group">
                            <label for="message">Your Message</label>
                            <textarea
                                id="message"
                                name="message"
                                rows="4"
                                placeholder="Write your message..."
                                required></textarea>
                        </div>

                        <button type="submit" class="send-btn">
                            Send Message
                        </button>

                    </form>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
